# Render Blueprint: one free web service that builds the React app and serves it from Express.
# Deploy: https://render.com/deploy?repo=https://github.com/anipriyo/mediflow-hms
# The free disk is ephemeral, so the SQLite demo database is recreated (and re-seeded with
# that day's dates) on every deploy, restart and wake-up after 15 minutes idle.
services:
  - type: web
    name: mediflow-hms
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node server/index.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
